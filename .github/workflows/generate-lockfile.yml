name: Generate lockfile

on:
  push:
    paths:
      - .github/workflows/generate-lockfile.yml
      - package.json
      - apps/**/package.json
      - packages/**/package.json

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/ginmap-v1
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit package-lock.json
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore: lock npm dependencies"
          git push origin HEAD:feat/ginmap-v1
