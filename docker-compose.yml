services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ginmap
      POSTGRES_USER: ginmap
      POSTGRES_PASSWORD: ginmap
    volumes:
      - ginmap-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ginmap"]
      interval: 5s
      timeout: 3s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://ginmap:ginmap@db:5432/ginmap
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: .
    restart: unless-stopped
    command: ["npm", "run", "start", "--workspace", "@ginmap/worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://ginmap:ginmap@db:5432/ginmap
    depends_on:
      db:
        condition: service_healthy

volumes:
  ginmap-db:
